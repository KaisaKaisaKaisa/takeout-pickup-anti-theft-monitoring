version: "3.8"
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: takeout_guard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:RELEASE.2024-01-13T07-53-03Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  api:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ../../apps/api:/app
    command: sh -lc "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      DB_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/takeout_guard
      JWT_SECRET: dev-secret
      RUN_BACKGROUND_TASKS: "false"
    ports:
      - "127.0.0.1:18000:8000"
    depends_on:
      - postgres
      - redis
      - minio

  worker:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ../../apps/api:/app
    command: sh -lc "pip install -r requirements.txt && python -m app.worker"
    environment:
      DB_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/takeout_guard
      JWT_SECRET: dev-secret
    depends_on:
      - postgres
      - redis
      - minio

volumes:
  pgdata:
  miniodata:
